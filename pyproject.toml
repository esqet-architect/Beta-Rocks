[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fossil-scanner"
version = "0.2.0"
description = "Field specimen capture, survey, and evidence-ranked identification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marco Antônio Rocha Jr." }]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
acoustic = ["numpy>=1.24"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
fossil-scan = "fossil_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
