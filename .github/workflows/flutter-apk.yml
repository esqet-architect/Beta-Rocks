name: Build FossilScanner APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: flutter_frontend

      - name: Analyze Code
        run: flutter analyze || true
        working-directory: flutter_frontend

      - name: Ensure Android Platform Exists
        run: flutter create --platforms=android .
        working-directory: flutter_frontend

      - name: Build APK
        run: flutter build apk --release
        working-directory: flutter_frontend

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_frontend/build/app/outputs/flutter-apk/app-release.apk
